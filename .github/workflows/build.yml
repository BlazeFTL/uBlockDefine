name: Build uBlock0 Fork

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firefox XPI
        run: make firefox

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: uBlock0-fork-firefox
          path: dist/build/uBlock0.firefox.xpi
          if-no-files-found: error
