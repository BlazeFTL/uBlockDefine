name: Release XPI

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and re-publish even if this version already has a release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  ADDON_ID: ${{ vars.ADDON_ID }}
  XPI_NAME: uBlockDefine.firefox.xpi

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check version
        id: v
        run: |
          V=$(tr -d '[:space:]' < dist/version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "Release v$V exists, force rebuild."
              gh release delete "v$V" --cleanup-tag --yes
            else
              echo "Release v$V exists, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Apply patches
        if: steps.v.outputs.skip != 'true'
        run: python3 apply_patches.py .

      - name: Apply CodeMirror mobile input patches
        if: steps.v.outputs.skip != 'true'
        run: python3 patch.py .

      - name: Apply My filters fold + About patches
        if: steps.v.outputs.skip != 'true'
        run: python3 patch2.py .

      - name: Set add-on id and update_url
        if: steps.v.outputs.skip != 'true'
        run: python3 set_update_url.py .

      - name: Build Firefox XPI
        if: steps.v.outputs.skip != 'true'
        run: |
          make firefox
          cp dist/build/uBlock0.firefox.xpi "$XPI_NAME"

      - name: Write update manifest
        if: steps.v.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          v, repo = os.environ['V'], os.environ['GITHUB_REPOSITORY']
          with zipfile.ZipFile(os.environ['XPI_NAME']) as z:
              gecko = json.loads(z.read('manifest.json'))['browser_specific_settings']['gecko']
          addon_id = gecko['id']
          if 'raymondhill' in addon_id or 'update_url' not in gecko:
              raise SystemExit('XPI manifest has upstream id or no update_url')
          data = {"addons": {addon_id: {"updates": [{
              "version": v,
              "browser_specific_settings": {"gecko": {"strict_min_version": gecko.get("strict_min_version", "128.0")}},
              "update_link": f"https://github.com/{repo}/releases/download/v{v}/{os.environ['XPI_NAME']}"
          }]}}}
          with open('updates.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"version `{v}`, add-on id `{addon_id}`\n")
          PY

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$V" "$XPI_NAME" \
            --target "$GITHUB_SHA" \
            --title "$V" \
            --notes "uBlock Origin $V + define patches. Unsigned."
          gh release view updates >/dev/null 2>&1 || gh release create updates \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Update manifest" \
            --notes "Auto-managed by release.yml. Do not delete."
          gh release upload updates updates.json --clobber
